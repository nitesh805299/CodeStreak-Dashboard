; =====================================================
; GITHUB REAL DATA
; =====================================================

[MeasureGitHubCurrentStreak]
Measure=Plugin
Plugin=WebParser
URL=file://#CURRENTPATH#github-data.txt
RegExp=(?siU)CurrentStreak=(.*)\n
StringIndex=1
UpdateRate=10


