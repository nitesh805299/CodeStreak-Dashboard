Author=Nitesh
Information=Developer Streak Tracker with GitHub, LeetCode and LinkedIn
Version=6.0


; =====================================================
; COLORS
; =====================================================

[Variables]

Green=57,211,83,255
Orange=255,161,22,255
Blue=10,132,255,255

White=255,255,255,255
